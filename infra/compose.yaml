# 03 실험부터 함께 쓰는 DB 서버다. 맥에서는 Docker Desktop으로 띄운다.
# MySQL은 127.0.0.1:13306(root, 비밀번호 없음), PostgreSQL은 127.0.0.1:15432(postgres, trust)로 붙는다.
# 실험용 서버라 비밀번호를 두지 않는 대신 포트를 127.0.0.1에만 연다.
# 데이터는 컨테이너의 익명 볼륨에 둔다. `docker compose down -v`로 지우면 처음 상태로 돌아간다.
name: cs-lab

services:
  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: lab
    ports:
      - "127.0.0.1:13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 2s
      timeout: 5s
      retries: 90

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: lab
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "lab"]
      interval: 2s
      timeout: 5s
      retries: 90
